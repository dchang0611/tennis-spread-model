name: Build and deploy tennis spread board

on:
  workflow_dispatch:
  schedule:
    # Avoid the top-of-hour congestion window documented by GitHub Actions.
    - cron: "37 0 * * *"
      timezone: "America/Los_Angeles"
    - cron: "37 6 * * *"
      timezone: "America/Los_Angeles"
    - cron: "37 10 * * *"
      timezone: "America/Los_Angeles"
  push:
    branches: [main]
    paths:
      - "data/novig_spreads.csv"
      - "data/verified_atp_results.csv"
      - "data/scrape_status.json"
      - "data/settlement_status.json"
      - "data/scoring_status.json"
      - "tennis_model_output/spread_results_history.csv"
      - "tennis_spread_model.py"
      - "novig_scraper.py"
      - "surface_calendar.py"
      - "update_spread_history.py"
      - "test_novig_automation.py"
      - "build_spread_site.py"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/spread-board.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      market_ready: ${{ steps.health.outputs.market_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v test_tennis_spread_model.py test_novig_automation.py
      - name: Recreate prior recommendations for the ledger
        shell: bash
        run: |
          if [ "$(wc -l < data/novig_spreads.csv)" -gt 1 ]; then
            python tennis_spread_model.py --markets data/novig_spreads.csv --model-rows model_rows_2026-07-06.csv
          fi
      - name: Archive yesterday's recommended bets
        run: python update_spread_history.py --mode archive
      - name: Score completed bets for Historical Performance
        run: python update_spread_history.py --mode settle
      - name: Collect today's Novig ATP spreads
        shell: bash
        run: |
          rm -f /tmp/tennis_scrape_ok
          if python novig_scraper.py --output data/novig_spreads.csv --status-file data/scrape_status.json --tournament "ATP" --surface Auto --day-label Today --minimum-matches 1; then
            touch /tmp/tennis_scrape_ok
          else
            echo "Novig has no complete Today spread slate; publishing explicit diagnostics instead of stale data."
            rm -f data/novig_spreads.csv
            rm -f tennis_model_output/novig_spread_recommendations.csv
          fi
      - name: Score current Novig markets
        shell: bash
        run: |
          if [ -f /tmp/tennis_scrape_ok ] && [ "$(wc -l < data/novig_spreads.csv)" -gt 1 ]; then
            python tennis_spread_model.py --markets data/novig_spreads.csv --model-rows model_rows_2026-07-06.csv --status-file data/scoring_status.json
          else
            echo "No fresh complete Novig rows exist; publishing a closed board with diagnostics."
            rm -f tennis_model_output/novig_spread_recommendations.csv
            rm -f data/scoring_status.json
          fi
      - name: Lock today's first qualified bets into Historical Performance
        run: python update_spread_history.py --mode archive
      - run: python build_spread_site.py
      - name: Record market refresh health
        id: health
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import date
          board = json.loads(Path('site/data/board.json').read_text())
          ready = bool(board['scrape_status'].get('success') and board['scoring_status'].get('success'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'market_ready={str(ready).lower()}\n')
          assignment = board['scrape_status'].get('surface_assignment', {})
          end = assignment.get('coverage_through')
          if end and (date.fromisoformat(end) - date.fromisoformat(board['scrape_status']['match_date'])).days <= 14:
              print(f'::warning::Verified surface calendar ends {end}; update tournament coverage before expiry.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(board['status_message'] + '\n')
          PY
      - name: Persist nightly market and history data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data tennis_model_output/spread_results_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update nightly tennis board [skip ci]"
            if ! git push; then
              echo "Remote advanced during this run; rebasing the generated data commit once."
              git pull --rebase origin main
              git push
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag unavailable market refresh after publishing diagnostics
        if: needs.build.outputs.market_ready != 'true'
        run: |
          echo "::error::Site deployed, but fresh Novig collection/scoring failed. See the published diagnostics."
          exit 1
