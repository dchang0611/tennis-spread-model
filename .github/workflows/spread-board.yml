name: Build and deploy tennis spread board
on:
  schedule:
    - cron: '0 0 * * *'
      timezone: America/Los_Angeles
    - cron: '0 1 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'research/**', 'model_policy.json', 'small_edge_experiment.json', 'site/**', 'requirements.txt', '.github/workflows/spread-board.yml', 'data/verified_atp_results.csv', 'data/reconstructed_history.json', 'data/baseline_comparison.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh_needed:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 daily_refresh_guard.py
  build:
    needs: refresh_needed
    if: needs.refresh_needed.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pipeline_ready: ${{ steps.health.outputs.pipeline_ready }}
      board_sha: ${{ steps.receipt.outputs.board_sha }}
      app_sha: ${{ steps.receipt.outputs.app_sha }}
      styles_sha: ${{ steps.receipt.outputs.styles_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued runs must include the preceding run's immutable history.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -v
      - run: node tests/snapshot_lifecycle.cjs
      - name: Verify frozen baseline research receipts
        run: python research/verify_baseline.py
      - name: Reconcile legacy results without recreating old predictions
        run: python update_spread_history.py --mode settle
      - name: Collect current Novig spreads
        continue-on-error: true
        run: python novig_scraper.py --output data/novig_spreads.csv --status-file data/scrape_status.json --tournament ATP --surface Auto --minimum-matches 0
      - name: Refresh sources and build prospective paper predictions
        run: python run_paper_pipeline.py
      - name: Publish paper-only or closed status
        run: python build_spread_site.py
      - name: Record health independently from deployment
        id: health
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          board = json.loads(Path('site/data/board.json').read_text())
          assert board['model']['live_enabled'] is False
          assert not any(p['recommendation'] == 'BET' for p in board['picks'])
          ready = board['status'] in ('paper_only', 'no_markets')
          if board['scrape_status'].get('partial_coverage'):
              print('::warning::Market coverage is partial; incomplete matches excluded.')
          if board['settlement_status'].get('complete') is not True:
              print('::warning::Historical settlement remains incomplete; see settlement_status.json.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'pipeline_ready={str(ready).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(board['status_message'] + '\n')
          PY
      - name: Preserve run evidence before any history synchronization
        if: always()
        run: tar -czf "$RUNNER_TEMP/tennis-run-evidence.tar.gz" data tennis_model_output site/data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immutable-run-evidence
          path: ${{ runner.temp }}/tennis-run-evidence.tar.gz
          retention-days: 90
      - name: Persist immutable paper evidence and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data tennis_model_output/spread_results_history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update tennis paper evidence and diagnostics [skip ci]'
            if ! git push; then
              git pull --rebase origin main
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-inputs-and-evaluation
          path: |
            data/match_sources
            data/source_status.json
            data/scoring_status.json
            tennis_model_output/spread_validation_summary.csv
            tennis_model_output/spread_rolling_predictions.csv
          retention-days: 90
      - uses: actions/configure-pages@v5
      - name: Record exact publication receipts
        id: receipt
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, path in [('board_sha','site/data/board.json'), ('app_sha','site/app.js'), ('styles_sha','site/styles.css')]:
                  out.write(f'{key}={hashlib.sha256(Path(path).read_bytes()).hexdigest()}\n')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy paper-only board and diagnostics
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public site matches this run
        env:
          BOARD_SHA: ${{ needs.build.outputs.board_sha }}
          APP_SHA: ${{ needs.build.outputs.app_sha }}
          STYLES_SHA: ${{ needs.build.outputs.styles_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, os, time, urllib.request
          base = 'https://dchang0611.github.io/tennis-spread-model/'
          paths = [('data/board.json','BOARD_SHA'), ('app.js','APP_SHA'), ('styles.css','STYLES_SHA')]
          errors = []
          for attempt in range(6):
              errors = []
              for path, key in paths:
                  try:
                      request = urllib.request.Request(base + path + '?verify=' + os.environ['GITHUB_RUN_ID'], headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          actual = hashlib.sha256(response.read()).hexdigest()
                      if actual != os.environ[key]:
                          errors.append(path + ': public content differs from this run')
                  except Exception as exc:
                      errors.append(path + ': ' + str(exc))
              if not errors:
                  break
              if attempt < 5:
                  time.sleep(10)
          if errors:
              raise SystemExit('Publication verification failed: ' + '; '.join(errors))
          print('Verified public board, application and styles match this run exactly.')
          PY
      - name: Fail closed when paper inputs are unavailable
        if: needs.build.outputs.pipeline_ready != 'true'
        run: |
          echo '::error::Closed board deployed; paper inputs or validation gates failed. Live betting remains disabled.'
          exit 1
