name: Build and deploy tennis spread board

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/novig_spreads.csv"
      - "tennis_spread_model.py"
      - "build_spread_site.py"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/spread-board.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_tennis_spread_model.py
      - name: Score current Novig markets
        shell: bash
        run: |
          if [ "$(wc -l < data/novig_spreads.csv)" -gt 1 ]; then
            python tennis_spread_model.py --markets data/novig_spreads.csv --model-rows model_rows_2026-07-06.csv
          else
            echo "No current Novig rows; publishing a closed board."
          fi
      - run: python build_spread_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
