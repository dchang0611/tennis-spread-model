name: Build and deploy tennis spread board

on:
  workflow_dispatch:
  schedule:
    - cron: "7 0 * * *"
      timezone: "America/Los_Angeles"
  push:
    branches: [main]
    paths:
      - "data/novig_spreads.csv"
      - "tennis_model_output/spread_results_history.csv"
      - "tennis_spread_model.py"
      - "novig_scraper.py"
      - "update_spread_history.py"
      - "test_novig_automation.py"
      - "build_spread_site.py"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/spread-board.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v test_tennis_spread_model.py test_novig_automation.py
      - name: Recreate prior recommendations for the ledger
        shell: bash
        run: |
          if [ "$(wc -l < data/novig_spreads.csv)" -gt 1 ]; then
            python tennis_spread_model.py --markets data/novig_spreads.csv --model-rows model_rows_2026-07-06.csv
          fi
      - name: Archive prior picks and settle completed results
        run: python update_spread_history.py
      - name: Collect today's Novig ATP spreads
        shell: bash
        run: |
          rm -f data/scrape_ok
          if python novig_scraper.py --output data/novig_spreads.csv --tournament "ATP" --surface Hard --day-label Today --minimum-matches 2; then
            touch data/scrape_ok
          else
            echo "Novig has no usable Today slate yet; publishing a closed board while retaining history."
            rm -f tennis_model_output/novig_spread_recommendations.csv
          fi
      - name: Score current Novig markets
        shell: bash
        run: |
          if [ -f data/scrape_ok ] && [ "$(wc -l < data/novig_spreads.csv)" -gt 1 ]; then
            python tennis_spread_model.py --markets data/novig_spreads.csv --model-rows model_rows_2026-07-06.csv
          else
            echo "No fresh Novig rows; publishing a closed board."
          fi
      - run: python build_spread_site.py
      - name: Persist nightly market and history data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/novig_spreads.csv tennis_model_output/spread_results_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update nightly tennis board [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
