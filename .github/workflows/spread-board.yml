name: Build and deploy tennis spread board
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'research/**', 'model_policy.json', 'small_edge_experiment.json', 'site/**', 'requirements.txt', '.github/workflows/spread-board.yml', 'data/verified_atp_results.csv', 'data/reconstructed_history.json', 'data/baseline_comparison.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pipeline_ready: ${{ steps.health.outputs.pipeline_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued runs must include the preceding run's immutable history.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -v
      - name: Verify frozen baseline research receipts
        run: python research/verify_baseline.py
      - name: Reconcile legacy results without recreating old predictions
        run: python update_spread_history.py --mode settle
      - name: Collect current Novig spreads
        continue-on-error: true
        run: python novig_scraper.py --output data/novig_spreads.csv --status-file data/scrape_status.json --tournament ATP --surface Auto --minimum-matches 0
      - name: Refresh sources and build prospective paper predictions
        run: python run_paper_pipeline.py
      - name: Publish paper-only or closed status
        run: python build_spread_site.py
      - name: Record health independently from deployment
        id: health
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          board = json.loads(Path('site/data/board.json').read_text())
          assert board['model']['live_enabled'] is False
          assert not any(p['recommendation'] == 'BET' for p in board['picks'])
          ready = board['status'] in ('paper_only', 'no_markets') and not board['scrape_status'].get('partial_coverage') and board['settlement_status'].get('complete') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'pipeline_ready={str(ready).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(board['status_message'] + '\n')
          PY
      - name: Preserve run evidence before any history synchronization
        if: always()
        run: tar -czf "$RUNNER_TEMP/tennis-run-evidence.tar.gz" data tennis_model_output site/data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immutable-run-evidence
          path: ${{ runner.temp }}/tennis-run-evidence.tar.gz
          retention-days: 90
      - name: Persist immutable paper evidence and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data tennis_model_output/spread_results_history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update tennis paper evidence and diagnostics [skip ci]'
            if ! git push; then
              git pull --rebase origin main
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-inputs-and-evaluation
          path: |
            data/match_sources
            data/source_status.json
            data/scoring_status.json
            tennis_model_output/spread_validation_summary.csv
            tennis_model_output/spread_rolling_predictions.csv
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy paper-only board and diagnostics
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Fail closed when paper inputs are unavailable
        if: needs.build.outputs.pipeline_ready != 'true'
        run: |
          echo '::error::Closed board deployed; paper inputs or validation gates failed. Live betting remains disabled.'
          exit 1
